<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="800" fill="#1a1a1f"/>
  
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,107,53,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#grid)"/>
  
  <!-- Orange Gradient Circle -->
  <defs>
    <radialGradient id="orangeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="400" cy="400" r="300" fill="url(#orangeGrad)"/>
  
  <!-- User Icon -->
  <circle cx="400" cy="320" r="80" fill="#ff6b35" opacity="0.8"/>
  <path d="M 280 580 Q 280 450 400 450 Q 520 450 520 580" fill="#ff6b35" opacity="0.8"/>
  
  <!-- Text -->
  <text x="400" y="680" font-family="monospace" font-size="24" fill="#ffffff" opacity="0.6" text-anchor="middle">
    ADD YOUR PHOTO HERE
  </text>
  <text x="400" y="720" font-family="monospace" font-size="16" fill="#ff6b35" opacity="0.8" text-anchor="middle">
    Replace: /public/assets/images/profile.jpg
  </text>
</svg>
